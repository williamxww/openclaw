# ============================================================
# OPT 配置 — 交给 assemble agent 生成 workspace 蓝图
# 输入格式 YAML；输出的 openclaw.json 仍是 JSON
# 蓝图落点：kdx-minio/assemble/<opt.id>/
#   - 全局 openclaw.json：<opt.id>/openclaw.json（根下）
#   - 每个 agent（含 main）：<opt.id>/workspace/<agent_id>/
# ============================================================
opt:
  id: hr-demo                     # 唯一标识，决定蓝图路径 <opt_id>/
  name: HR 助手                    # 显示名，写入 IDENTITY.md

  # ---------- 程序预生成、已上传到 MinIO 的文件 ----------
  # 这些文件不由 assemble agent 渲染：程序已生成并传到 assemble/<opt_id>/ 的预定位置。
  # assemble 看到这里的声明就「跳过、不覆盖」，收尾自检也按声明跳过对应检查。
  prebuilt:
    openclawJson: true            # 根下 openclaw.json 由程序生成上传 → assemble 不渲染、不注册 skills.entries

  # ---------- 默认服务对象，写入每个 agent 的 USER.md ----------
  # 所有 agent 共用这份 owner；个别 agent 可在自己下面写 owner: 覆盖
  owner:
    name: 张三
    role: HR 专员
    timezone: Asia/Shanghai
    language: zh-CN
    notes:                        # 可选，写入 USER.md 的 Notes
      - 偏好先给结论再给依据
      - 政策类答案必须能说清来源

  agents:

    # ========== 主 agent：只做调度，自己不干具体活 ==========
    - id: main
      role: HR 助手主 agent。本身不处理具体业务，只负责理解员工意图、按场景把请求路由给合适的子 agent
      soul: |
        温和、有条理。
        先听清楚需求，判断该交给哪个子 agent。
        自己不杜撰专业答案，政策类问题一律转交 policy-expert。
        回复用中文，简洁清楚。
      llm:
        modelId: qwen3.5-35b
        temperature: 0.3

      # 子 agent 路由规则 → 写进 main 的 AGENTS.md「子 agent 路由」段
      routes:
        - when: 员工咨询 HR 政策、制度、考勤、薪酬、福利等事实问题
          to: policy-expert
          desc: 转交政策专家，引用权威条款作答

      # 红线（可选）→ 写进 AGENTS.md「红线」段
      redlines:
        - 不替员工做审批决定，涉及审批一律提示联系 HR 管理员
        - 不杜撰政策答案，政策问题必须路由给 policy-expert

    # ========== 子 agent：政策专家 ==========
    - id: policy-expert
      role: HR 政策专家，负责解答政策类事实问题，引用权威条款
      soul: |
        严谨、必引来源、不猜测。
        召回为空时如实说"未找到"，绝不杜撰条款。
      llm:
        modelId: qwen3.5-35b
        temperature: 0.1

      # 可选：覆盖默认 owner（本 agent 的 USER.md 用这份）
      # 政策专家是内部 agent，服务对象其实是 main，而非终端员工
      owner:
        name: main agent
        role: 上游调度 agent（HR 助手主 agent）
        notes:
          - 我是被 main 路由调用的内部专家，只回政策事实问题
          - 召回为空如实说"未找到"，不杜撰

      # skills[] 支持三种来源，用 source 区分：
      #   source: inline   —— 现场定义型，字段全写在 YAML 里，装配时现渲染 SKILL.md（默认）
      #   source: hub      —— 从 SKILL HUB 选的已有技能，xsystem 已把成品 SKILL.md 文本注入到 content
      #   source: prebuilt —— 程序已把 SKILL.md 传到 skills/<dir>/，assemble 不落盘，只用 usage 描述场景
      skills:

        # —— 现场定义型知识库（装配 agent 按字段渲染 kb-cli SKILL.md）——
        - source: inline
          kind: kb
          id: hr-policy
          displayName: HR 政策库
          domain: 员工手册、考勤、薪酬、福利政策
          permission: kb:hr-policy:read
          referenceFiles:          # 用户上传的参考文件 → skills/kb-hr-policy/reference/
            - reference/员工手册2026.pdf
            - reference/考勤制度.docx

        # —— 从 SKILL HUB 选的已有技能（xsystem 预先注入完整内容，装配 agent 原样落盘）——
        - source: hub
          id: doc-summarizer       # HUB 里的技能标识
          version: "1.3"           # 选定的版本
          dir: doc-summarizer      # 落点目录名 → skills/doc-summarizer/
          content: |               # xsystem 从 HUB 取出的完整 SKILL.md 文本，原样写文件
            ---
            name: doc-summarizer
            description: 对长文档做结构化摘要，输出要点清单
            version: "1.3"
            tools:
              - doc-cli
            ---

            # 文档摘要 Skill

            ## 何时使用
            - 需要把长文档压缩成要点时

            ## 命令格式
            ```bash
            doc-cli summarize --file <path> --max-points 10 --json
            ```
          referenceFiles: []       # HUB 技能如自带参考文件，xsystem 一并给出落点清单

        # —— 程序预生成、已上传的已有技能（SKILL.md 已在 MinIO，assemble 不落盘）——
        # 与 hub 的区别：不带 content（文件已在 MinIO），但必须带 usage——
        # assemble 看不到 SKILL.md 内容，只能靠 usage 知道「什么场景该用这个 SKILL」，
        # 据此写 main 的路由描述 / 本 agent AGENTS.md 能力表的「何时使用」。
        - source: prebuilt
          id: ocr-extract          # 技能标识
          dir: ocr-extract         # 落点目录名，必须与已上传的 skills/<dir>/ 一致
          displayName: 票据 OCR
          domain: 从图片/PDF 票据提取结构化字段
          permission: ocr:read     # 可选，用于 AGENTS.md 能力表
          usage:                   # ★ 必填：供 assemble 描述使用场景（assemble 不会读 SKILL.md 正文）
            - 员工上传报销票据图片，需要识别金额、日期、抬头时
            - 需要把扫描件里的表格转成结构化数据时
